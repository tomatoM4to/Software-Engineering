services:
  backend:
    image: ${IMAGE_TAG:-ghcr.io/tomatom4to/trading-backend:latest}
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./kis_devlp.yaml:/app/kis_devlp.yaml:ro # KIS 설정 파일
      # - .env:/app/.env:ro # 환경 변수 파일이 필요하다면 추가
    environment:
      - TZ=Asia/Seoul
      # 필요한 다른 환경 변수들 추가 (예: KIS_APPKEY, KIS_APPSECRET 등)

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.nginx/conf.d:/etc/nginx/templates:ro # templates 폴더로 변경
      # Certbot이 발급한 인증서 경로를 Nginx 컨테이너에 마운트
      - ./.nginx/certbot/conf:/etc/letsencrypt:ro
      - ./.nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - DOMAIN=${DOMAIN}

  # 인증서 자동 갱신을 위한 Certbot 서비스
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./.nginx/certbot/conf:/etc/letsencrypt
      - ./.nginx/certbot/www:/var/www/certbot
    # 12시간마다 갱신 필요 여부를 체크 (webroot 방식 사용)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"