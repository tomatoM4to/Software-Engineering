name: FastAPI CI/CD to OCI

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  # 1단계: 이미지 빌드 및 푸시
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-backend" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY  }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 2단계: OCI 서버에 배포
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-backend" >> $GITHUB_ENV

      - name: Copy docker-compose and nginx configs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.yml,.nginx"
          target: "~/trading-app"

      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          DOMAIN: ${{ secrets.DOMAIN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE_TAG,DOMAIN
          script: |
            cd ~/trading-app
            # GHCR 로그인
            echo "${{ secrets.CR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 환경 변수 및 로그 최적화 설정
            export IMAGE_TAG=$IMAGE_TAG
            export DOMAIN=$DOMAIN
            export DOCKER_CLI_PROGRESS_TYPE=plain
            
            echo "--- Pulling images ---"
            sudo -E docker compose pull 2>&1
            
            echo "--- Starting containers ---"
            sudo -E docker compose up -d 2>&1

            # 미사용 리소스 정리 (메모리/디스크 확보)
            echo "--- Cleaning up ---"
            sudo docker system prune -f

  # 3단계: 배포 후 자동 헬스체크
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Health Check
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          # 배포 후 서비스가 안정화될 때까지 잠시 대기 (10초)
          sleep 10
          python scripts/health_check.py --domain $DOMAIN